site_name: Kraken
site_description: Phase-field fracture modelling framework


theme: 
    name: 'readthedocs'
    #name: 'material'    
    features:
        - content.code.copy

nav:
  - About: index.md
  - Install: install.md
  - Tutorials:
    - Elastic Iceberg: tutorials/1_elastic_iceberg.py
  - API:
    - Overview: api/index.md
    - Base: api/base.md
    - Damage: api/damage.md
    - Momentum: api/momentum.md
    - Parameters: api/parameters.md
    - Numerics: api/numerics.md
    - Boundary Conditions: api/boundaryconditions.md
    - Meshes: api/meshes.md
    - Plotting: api/plotting.md

plugins:
  - search
  - mkdocstrings
  - mkdocs-jupyter


markdown_extensions:
    - attr_list
    - admonition
    - pymdownx.details
    - pymdownx.arithmatex:
        generic: true
    - pymdownx.highlight:
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.blocks.html
#    - pymdownx.superfences

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js

